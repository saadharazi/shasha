<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Shasha brand</title>
<!-- يرسم بانر التلفزيون (320×180) وصورة المشاركة (1200×630) بخط Tajawal. صوّرها بالمتصفح بنفس المقاس. -->
<style>
  @font-face { font-family: Tajawal; font-weight: 700; src: url(../../iptv/app/assets/fonts/Tajawal-Bold.ttf); }
  @font-face { font-family: Tajawal; font-weight: 400; src: url(../../iptv/app/assets/fonts/Tajawal-Regular.ttf); }
  html, body { margin: 0; background: #0F1012; }
  .card { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0F1012; color: #F3F3F0; font-family: Tajawal; }
  .card::before { content: ""; position: absolute; inset: -30%; background: radial-gradient(closest-side at 70% 40%, rgba(142,168,204,.16), transparent 70%); }
  .lockup { position: relative; display: flex; align-items: center; gap: .32em; }
  .lockup svg { width: 1.05em; height: 1.05em; }
  .word { font-weight: 700; line-height: 1; padding-top: .18em; }
  .banner { width: 320px; height: 180px; font-size: 66px; }
  .og { width: 1200px; height: 630px; font-size: 150px; flex-direction: column; gap: 34px; }
  .og p { position: relative; margin: 0; font-size: 40px; font-weight: 400; color: rgba(243,243,240,.66); }
</style>
</head>
<body>
<script>
  const mark = '<svg viewBox="0 0 24 24"><path d="M6.5,4.5h11a3.5,3.5 0 0,1 3.5,3.5v8a3.5,3.5 0 0,1 -3.5,3.5h-11A3.5,3.5 0 0,1 3,16v-8A3.5,3.5 0 0,1 6.5,4.5z" fill="none" stroke="#F3F3F0" stroke-width="1.9"/><path d="M10.3,9.3v5.4l4.6,-2.7z" fill="#8EA8CC" stroke="#8EA8CC" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  const og = location.search.includes('og');
  document.body.innerHTML = og
    ? `<div class="card og"><div class="lockup">${mark}<span class="word">شاشة</span></div><p>مشغّل IPTV مفتوح المصدر للتلفزيون والجوال</p></div>`
    : `<div class="card banner"><div class="lockup">${mark}<span class="word">شاشة</span></div></div>`;
</script>
</body>
</html>
