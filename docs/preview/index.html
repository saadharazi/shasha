<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>واجهتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --s    { syntax: '<number>';     inherits: false; initial-value: 1; }
@property --lift { syntax: '<length>';     inherits: false; initial-value: 0px; }
@property --rx   { syntax: '<angle>';      inherits: false; initial-value: 0deg; }
@property --ry   { syntax: '<angle>';      inherits: false; initial-value: 0deg; }
@property --gx   { syntax: '<percentage>'; inherits: true;  initial-value: 30%; }
@property --gy   { syntax: '<percentage>'; inherits: true;  initial-value: 10%; }

:root {
  --ease: cubic-bezier(.22, .8, .24, 1);
  --spring: cubic-bezier(.3, 1.35, .5, 1);
  --soft: cubic-bezier(.45, 0, .25, 1);
  --text: #F5F7FB;
  --text-2: rgba(245, 247, 251, .72);
  --text-3: rgba(245, 247, 251, .48);
  --display: Alexandria, Tajawal, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: Tajawal, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; }
p, h1, h2 { margin: 0; font-weight: inherit; font-size: inherit; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: var(--text); }
/* العالم كله (الخلفية والزجاج والتطبيقات) يرجع لورا لما تفتح قائمة */
.world { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%;
         transition: transform .75s var(--ease), filter .6s var(--soft), border-radius .75s var(--ease); }
#stage.sheet-open .world { transform: scale(.92) translateX(80px); filter: brightness(.48) saturate(.85); border-radius: 56px; }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

/* ---------- الشريط العلوي (الزجاج نفسه مرسوم في الشيدر تحتها) ---------- */
.cap { position: absolute; top: 52px; height: 80px; display: flex; align-items: center; }
/* فوق يسار: الوقت والشبكة بس (الترحيب والتاريخ والصلاة نزلت لـ .info بخط يُقرأ من الكنب) */
.cap-clock { left: 96px; padding: 0 36px; gap: 28px; }
.clk { display: flex; align-items: baseline; gap: 8px; direction: ltr; font-family: var(--display); font-weight: 300;
       font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; }
.clk small { font-family: Tajawal; font-size: 22px; font-weight: 500; color: var(--text-2); }
.net { display: grid; color: var(--text-2); }
.net svg { width: 30px; height: 30px; stroke-width: 2.2; }

/* ---------- الترحيب والتاريخ والصلاة: مقابل اسم التطبيق (كانت مساحة فاضية) ---------- */
/* الكتلة على اليسار، بس أسطرها عربي: تبدأ من اليمين على خط واحد (كانت لاصقة يسار وأطرافها اليمين متعرّجة) */
.info { position: absolute; left: 148px; top: 180px; height: 300px; display: flex; flex-direction: column; justify-content: flex-end;
        align-items: flex-start; white-space: nowrap; pointer-events: none; }
.info b { font-weight: 500; font-size: 42px; line-height: 1.3; }
.info .date { margin-top: 8px; font-size: 28px; line-height: 1.4; color: var(--text-2); }
.pray { display: flex; align-items: center; gap: 16px; margin-top: 18px; font-size: 28px; line-height: 1.4; color: var(--text-2); }
.pray strong { font-weight: 500; color: var(--text); }
.pray svg { width: 32px; height: 32px; color: var(--accent); }
.cap-tabs { right: 96px; padding: 0 8px; }
/* الأقسام غير المختارة كانت باهتة (48%) لدرجة ما تنقرى من الكنب: المختار يبان بالشريحة أصلاً */
.tab { height: 64px; padding: 0 22px; display: grid; place-items: center; font-weight: 500; font-size: 26px; white-space: nowrap;
       color: var(--text-2); transition: color .35s; cursor: pointer; }
.tab.is-active { color: var(--text); }

/* ---------- البطل: التطبيق المختار بكبير ---------- */
.hero { position: absolute; right: 148px; top: 180px; width: 1300px; height: 300px; pointer-events: none; }
.hero-item { position: absolute; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.hero-title { font-family: var(--display); font-weight: 800; font-size: var(--fs, 128px); line-height: 1.08; letter-spacing: -.02em; white-space: nowrap;
              text-shadow: 0 0 90px color-mix(in srgb, var(--tint) 60%, transparent), 0 6px 40px rgba(0,0,0,.35); }
.hero-meta { display: flex; align-items: center; gap: 14px; font-size: 30px; color: var(--text-2); }
.hero-meta i { width: 12px; height: 12px; border-radius: 50%; background: var(--tint); box-shadow: 0 0 18px 2px var(--tint); }
.hero-item.in { animation: heroIn .75s var(--ease) both; }
.hero-item.out { animation: heroOut .45s var(--soft) both; }
@keyframes heroIn { from { opacity: 0; filter: blur(18px); transform: translateX(var(--dx, 0px)) scale(.96); } }
@keyframes heroOut { to { opacity: 0; filter: blur(18px); transform: translateX(calc(var(--dx, 0px) * -1)) scale(1.03); } }

/* التلميحات بس وقت الترتيب: «OK تشغيل» الدائمة كانت زحمة بين اسم التطبيق والرف */
.hints { position: absolute; right: 148px; top: 506px; display: flex; gap: 14px; }
.hint { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px 0 22px; border-radius: 999px; font-size: 22px;
        color: var(--text-2); white-space: nowrap; background: rgba(255,255,255,.08);
        -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.24); }
.key { min-width: 38px; height: 32px; padding: 0 9px; border-radius: 9px; display: grid; place-items: center; direction: ltr;
       font-weight: 700; font-size: 17px; color: var(--text); background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,.26); }
.key svg { width: 18px; height: 18px; stroke-width: 2.4; }
.keys { display: flex; gap: 6px; }

/* ---------- الرف الزجاجي ---------- */
.shelf { position: absolute; left: 96px; right: 96px; top: 592px; height: 424px; }
.shelf-head { position: absolute; top: 30px; left: 52px; right: 52px; height: 40px; display: flex; align-items: center; justify-content: space-between; }
.shelf-title { font-weight: 700; font-size: 28px; }
.shelf-row { position: absolute; left: 0; right: 0; top: 74px; bottom: 0;
             -webkit-mask-image: linear-gradient(to left, transparent 0, #000 46px, #000 calc(100% - 46px), transparent);
                     mask-image: linear-gradient(to left, transparent 0, #000 46px, #000 calc(100% - 46px), transparent); }
.shelf-track { position: absolute; top: 44px; right: 52px; display: flex; gap: 36px; perspective: 1600px;
               transition: transform .55s var(--ease); }

.tile { position: relative; flex: none; width: 320px; height: 180px; perspective: 1100px; cursor: pointer; }
.card { position: absolute; inset: 0; border-radius: 26px; overflow: hidden;
        transform: translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
        transition: --s .55s var(--spring), --lift .55s var(--spring), --rx .7s var(--ease), --ry .7s var(--ease), box-shadow .45s var(--ease);
        box-shadow: 0 18px 40px -22px rgba(0,0,0,.85);
        /* انعكاس خفيف يختفي بسرعة (كان يطلع مثل لوح رمادي) */
        -webkit-box-reflect: below 16px linear-gradient(to bottom, transparent 64%, rgba(255,255,255,.13)); }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
               background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 44%);
               box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), inset 0 1px 0 rgba(255,255,255,.34); }
.glare { position: absolute; inset: -30%; pointer-events: none; mix-blend-mode: overlay; opacity: 0; transition: opacity .45s;
         background: radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,.75), rgba(255,255,255,0) 38%); }
.tile.is-focused .card { --s: 1.13; --lift: -10px; animation: float 7s ease-in-out infinite;
  box-shadow: 0 0 0 3px rgba(255,255,255,.95), 0 44px 80px -26px rgba(0,0,0,.9), 0 0 120px -10px var(--tint); }
.tile.is-focused .glare { opacity: 1; }
@keyframes float {
  0%, 100% { --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 0%; }
  25% { --rx: 5deg; --ry: -7deg; --gx: 22%; --gy: 12%; }
  75% { --rx: -4deg; --ry: 7deg; --gx: 80%; --gy: 30%; } }
.zone-tabs .tile.is-focused .card { --s: 1.03; --lift: 0px; animation: none;
  box-shadow: 0 0 0 2px rgba(255,255,255,.38), 0 18px 40px -22px rgba(0,0,0,.85); }
.zone-tabs .tile.is-focused .glare { opacity: 0; }
.tile.is-moving .card { --s: 1.2; --lift: -22px;
  box-shadow: 0 0 0 3px var(--accent), 0 0 0 16px color-mix(in srgb, var(--accent) 20%, transparent), 0 60px 90px -26px rgba(0,0,0,.95); }

.k-banner .card { background: linear-gradient(135deg, var(--bg1), var(--bg2)); }
.mark { position: absolute; inset: 0; display: grid; place-items: center; direction: ltr; white-space: nowrap;
        font-weight: 800; font-size: calc(48px * var(--fs, 1)); letter-spacing: -.01em; }
.k-icon .card { background: radial-gradient(120% 95% at 50% 115%, color-mix(in srgb, var(--tint) 46%, transparent), transparent 70%), rgba(255,255,255,.08); }
.appicon { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%); border-radius: 26px;
           display: grid; place-items: center; font-weight: 800; font-size: 44px; color: #fff;
           background: linear-gradient(155deg, color-mix(in srgb, var(--tint) 82%, #fff), color-mix(in srgb, var(--tint) 76%, #000));
           box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--tint) 70%, #000), inset 0 1px 0 rgba(255,255,255,.4); }
.appicon svg { width: 50px; height: 50px; }
.k-input .card, .k-settings .card { display: flex; align-items: center; justify-content: center; gap: 14px;
                                    background: rgba(255,255,255,.09); font-weight: 500; font-size: 28px; }
.k-settings .card { flex-direction: column; font-size: 25px; }
.k-input .card svg { width: 32px; height: 32px; opacity: .85; }
.k-settings .card svg { width: 52px; height: 52px; opacity: .92; }
/* «أضف للمفضلة»: مكان فاضي ينتظر تطبيق، زجاج أخف وحافة منقّطة */
.k-addfav .card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
                  font-weight: 500; font-size: 27px; color: var(--text); background: rgba(255,255,255,.04); box-shadow: none; }
.k-addfav .card > * { opacity: .82; }
.k-addfav .card::after { background: none; box-shadow: none; border: 3px dashed rgba(255,255,255,.34); }
.k-addfav .card svg { width: 52px; height: 52px; stroke-width: 2; }

/* ---------- تنبيه ---------- */
.toast { position: absolute; z-index: 30; left: 50%; bottom: 44px; padding: 18px 34px; border-radius: 999px; white-space: nowrap; pointer-events: none;
         background: rgba(16,20,32,.5); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
         box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.35), 0 24px 60px -24px rgba(0,0,0,.8);
         font-weight: 500; font-size: 26px; line-height: 1.3;
         opacity: 0; transform: translate(-50%, 30px) scale(.9); transition: opacity .35s var(--soft), transform .6s var(--spring); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- القوائم الجانبية ---------- */
.scrim { position: absolute; inset: 0; z-index: 40; opacity: 0; pointer-events: none; }
.scrim.show { pointer-events: auto; }
.sheet-wrap { position: absolute; z-index: 41; top: 40px; bottom: 40px; right: 40px; width: 730px; display: flex; pointer-events: none; }
.sheet { position: relative; width: 100%; max-height: 100%; align-self: flex-start; display: flex; flex-direction: column; border-radius: 52px;
         background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.05) 45%, rgba(255,255,255,.09)), rgba(12,16,28,.36);
         -webkit-backdrop-filter: blur(54px) saturate(1.8); backdrop-filter: blur(54px) saturate(1.8);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -24px 48px -36px rgba(255,255,255,.22), 0 70px 150px -40px rgba(0,0,0,.95);
         opacity: 0; transform: translateX(110px) scale(.92); transform-origin: 100% 20%;
         transition: opacity .3s var(--soft), transform .7s var(--spring); }
/* حافة لامعة: أفتح فوق ويمين، وتخف في النص */
.sheet::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
                 background: linear-gradient(140deg, rgba(255,255,255,.75), rgba(255,255,255,.08) 30%, rgba(255,255,255,.04) 70%, rgba(255,255,255,.4));
                 -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.sheet.show { opacity: 1; transform: none; pointer-events: auto; }
.sheet-in { min-height: 0; display: flex; flex-direction: column; padding: 62px 54px 50px; }
.sheet-title { margin: 0 24px; font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1.25; }
.sheet-sub { margin: 14px 24px 0; font-size: 25px; line-height: 1.6; color: var(--text-2); }
.sheet-body { margin: 22px 24px 0; font-size: 27px; line-height: 1.7; color: var(--text-2); }
.sheet-body p { margin-bottom: 14px; }
.sheet-body ul { margin: 0; padding: 0 28px 0 0; }
.sheet-body li { margin-bottom: 12px; }
.opts { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 36px; overflow: hidden; }
/* القائمة أطول من الشاشة: الطرف يذوب عشان يبان إن فيه خيارات تحت (أو فوق) */
.opts.more-b { -webkit-mask-image: linear-gradient(#000 calc(100% - 70px), transparent); mask-image: linear-gradient(#000 calc(100% - 70px), transparent); }
.opts.more-t { -webkit-mask-image: linear-gradient(transparent, #000 70px); mask-image: linear-gradient(transparent, #000 70px); }
.opts.more-t.more-b { -webkit-mask-image: linear-gradient(transparent, #000 70px, #000 calc(100% - 70px), transparent);
                      mask-image: linear-gradient(transparent, #000 70px, #000 calc(100% - 70px), transparent); }
.opts-in { position: relative; transition: transform .45s var(--ease); }
.hl { position: absolute; top: 0; left: 0; right: 0; height: 64px; border-radius: 22px; transition: transform .5s var(--spring);
      background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.1));
      box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.42), inset 0 1px 0 rgba(255,255,255,.6), 0 14px 34px -14px rgba(0,0,0,.6); }
.opt { position: relative; display: flex; align-items: center; gap: 20px; height: 64px; padding: 0 24px; margin-bottom: 4px;
       font-weight: 500; font-size: 28px; color: var(--text-2); cursor: pointer; transition: color .2s;
       animation: optIn .55s var(--ease) both; animation-delay: calc(var(--i) * 30ms + 120ms); }
@keyframes optIn { from { opacity: 0; transform: translateX(40px); } }
.opt.is-focused { color: var(--text); }
.opt > svg { width: 30px; height: 30px; flex: none; }
.opt .val { margin-inline-start: auto; font-weight: 400; font-size: 25px; color: var(--text-3); transition: color .2s; }
.opt.is-focused .val { color: var(--text-2); }
.opt .check { margin-inline-start: auto; display: grid; color: var(--accent); }
.opt .check svg { width: 28px; height: 28px; stroke-width: 2.4; }
.sep { display: block; height: 1px; margin: 10px 24px 12px; background: rgba(255,255,255,.12); }
.chip { width: 54px; height: 34px; flex: none; border-radius: 11px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), 0 6px 16px -8px rgba(0,0,0,.6); }
.opt .val + .check { margin-inline-start: 16px; }
.swatch { width: 32px; height: 32px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 0 16px -2px var(--sw); }
.sheet-input { display: block; width: calc(100% - 48px); height: 80px; margin: 34px 24px 0; padding: 0 26px; border: 0; outline: 0;
               border-radius: 24px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.45);
               color: var(--text); font: 500 32px Tajawal, sans-serif; caret-color: var(--accent); }
.sheet-hint { margin: 16px 24px 0; font-size: 23px; color: var(--text-3); }

/* ---------- الدخولية (الضوء والزجاج من الشيدر، والكلام هنا) ---------- */
.intro { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
.intro-text { text-align: center; transition: opacity .6s var(--soft), transform .8s var(--ease), filter .6s; }
.intro.out .intro-text { opacity: 0; transform: scale(.9); filter: blur(14px); }
.intro-hello { font-family: var(--display); font-weight: 800; font-size: 136px; line-height: 1.12; color: transparent;
               background: linear-gradient(100deg, #fff 0%, #fff 42%, var(--accent) 50%, #fff 58%, #fff 100%); background-size: 320% 100%;
               -webkit-background-clip: text; background-clip: text;
               animation: write 1.2s 2.05s var(--ease) both, glint 1.8s 2.9s var(--soft) both; }
/* الكتابة تنكشف من اليمين لليسار مثل اتجاه القراءة */
@keyframes write { from { clip-path: inset(-30% -8% -30% 108%); filter: blur(12px); } to { clip-path: inset(-30% -8% -30% -8%); filter: blur(0); } }
@keyframes glint { from { background-position: 100% 0; } to { background-position: 0% 0; } }
.intro-sub { margin-top: 18px; font-size: 32px; color: var(--text-2); animation: rise .8s 2.7s var(--ease) both; }
.intro-time { margin-top: 26px; direction: ltr; font-family: var(--display); font-weight: 200; font-size: 66px; line-height: 1; animation: rise .8s 2.95s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } }

#stage.intro-on .cap > *, #stage.intro-on .hero, #stage.intro-on .info, #stage.intro-on .hints, #stage.intro-on .shelf > * { opacity: 0; }
#stage.entering .cap > * { animation: rise .8s .35s var(--ease) both; }
#stage.entering .hero { animation: heroIn 1s .5s var(--ease) both; }
#stage.entering .info { animation: rise .8s .6s var(--ease) both; }
#stage.entering .hints { animation: rise .8s .8s var(--ease) both; }
#stage.entering .shelf-head { animation: rise .8s .45s var(--ease) both; }

/* =====================================================================
   الثيمات: كل ثيم شكل كامل (التخطيط والمادة والحركة)، والألوان تمشي معها كلها
   ===================================================================== */
.floor { position: absolute; left: 168px; width: 1300px; top: 696px; height: 40px; visibility: hidden; pointer-events: none; }

/* ---- سينما: بدون ألواح، الشاشة كلها تاخذ ضوء التطبيق مثل مسرح ---- */
.st-cinema .cap-clock { padding: 0; gap: 22px; }
.st-cinema .clk { font-size: 58px; font-weight: 200; }
.st-cinema .cap-tabs { padding: 0; }
.st-cinema .tab { padding: 0 20px; }
.st-cinema .hero, .st-cinema .info { top: 196px; height: 330px; }
.st-cinema .hero-title { font-size: calc(var(--fs, 128px) * 1.18); text-shadow: 0 0 140px color-mix(in srgb, var(--tint) 70%, transparent), 0 8px 40px rgba(0,0,0,.5); }
.st-cinema .hints { top: 548px; }
.st-cinema .hint { background: rgba(255,255,255,.06); }
.st-cinema .shelf { top: 636px; height: 440px; }
.st-cinema .shelf-head { top: 4px; }
.st-cinema .shelf-row { top: 46px; }
.st-cinema .shelf-track { gap: 40px; }
.st-cinema .tile { width: 360px; height: 203px; }
.st-cinema .mark { font-size: calc(54px * var(--fs, 1)); }
.st-cinema .card { -webkit-box-reflect: below 20px linear-gradient(to bottom, transparent 62%, rgba(255,255,255,.18)); }
.st-cinema .tile.is-focused .card { --s: 1.1;
  box-shadow: 0 0 0 3px #fff, 0 0 180px 6px color-mix(in srgb, var(--tint) 55%, transparent), 0 50px 90px -30px #000; }

/* ---- مدار: التطبيقات تدور حولك على حلقة، والأقسام عمود زجاج ---- */
.st-orbit .cap-tabs { top: 52px; right: 96px; height: auto; width: 250px; flex-direction: column; align-items: stretch; padding: 12px 10px; }
.st-orbit .tab { height: 64px; padding: 0 26px; place-items: center start; }
/* الحلقة واسمها أنزل بـ56: بعد ما راحت التلميحات صار تحت فاضي، والترحيب فوق يبي مكان */
.st-orbit .hero { left: 96px; right: 380px; width: auto; top: 774px; height: 150px; }
.st-orbit .hero-item { left: 0; right: 0; bottom: auto; top: 0; align-items: center; text-align: center; gap: 10px; }
.st-orbit .hero-title { font-size: calc(var(--fs, 128px) * .58); }
.st-orbit .hero-meta { font-size: 26px; }
.st-orbit .hints { left: 96px; right: 380px; top: 942px; justify-content: center; }
.st-orbit .info { left: 132px; top: 168px; height: auto; justify-content: flex-start; }
.st-orbit .shelf { left: 96px; right: 380px; top: 274px; height: 560px; }

<!-- الطبقة 1: حرير سائل يتحرك، يتلوّن بالتطبيق المختار، وموجة ضوء من البطاقة -->
<script id="fsBg" type="x-shader">
precision highp float;
varying vec2 vUv;
uniform float uTime, uAsp, uReveal, uStreak, uPulse, uMode;
uniform vec3 uBase, uC1, uC2, uC3, uTint;
uniform vec2 uTintPos, uPulsePos;

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0., a = .5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++) { v += a * noise(p); p = m * p; a *= .5; }
  return v;
}

void main() {
  vec2 uv = vUv;
  vec2 s = vec2(uv.x * uAsp, uv.y);
  int m = int(uMode + .5);
  vec2 p = s * (m == 2 ? .8 : 1.25);
  float t = uTime * (m == 2 ? .014 : .03);
  vec2 q = vec2(fbm(p + vec2(0., t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 2.4 * q + vec2(1.7, 9.2) + 1.3 * t), fbm(p + 2.4 * q + vec2(8.3, 2.8) - 1.1 * t));
  float f = fbm(p + 2.2 * r);

  vec3 col = uBase;
  col = mix(col, uC1, smoothstep(.28, .8, f) * .92);
  col = mix(col, uC2, smoothstep(.35, .95, length(q)) * .72);
  col = mix(col, uC3, smoothstep(.55, .92, r.y) * .55);
  // طيّات الحرير
  float folds = .5 + .5 * sin(f * 10. + r.x * 6. - uTime * .16);
  col += pow(folds, 9.) * mix(uC1, vec3(1.), .55) * .26 * smoothstep(.3, .75, f);

  vec2 tp = vec2(uTintPos.x * uAsp, uTintPos.y);
  float dt = length(s - tp);
  // موجة ضوء تطلع من البطاقة لما تتنقل
  float wave = 0.;
  if (uPulse > 0. && uPulse < 1.) {
    vec2 pp = vec2(uPulsePos.x * uAsp, uPulsePos.y);
    float d = length(s - pp), R = uPulse * 1.7;
    wave = exp(-pow((d - R) * 6., 2.)) * (1. - uPulse);
  }
  float vig = length((uv - .5) * vec2(uAsp, 1.));

  if (m == 0) { // زجاج سائل: بركة ضوء بلون التطبيق المختار
    col += uTint * exp(-dt * dt * 3.2) * (.28 + .36 * f);
    col += uTint * wave * (.35 + .7 * f);
    // عمق ووضوح للنص
    vec2 hc = (uv - vec2(.74, .6)) * vec2(uAsp * .85, 1.7);
    col *= 1. - .32 * exp(-dot(hc, hc) * 1.6);
    col *= mix(.62, 1.05, smoothstep(0., .75, uv.y));
    col *= .7 + .3 * smoothstep(1.35, .3, vig);
  } else if (m == 1) { // سينما: الحرير يخفت، وضوء مسرح من فوق الشاشة يلاحق التطبيق المختار
    col = mix(uBase, col, .45) * .42;
    vec2 o = vec2(.6 * uAsp, 1.5), dir = normalize(tp - o), dd = s - o;
    float along = dot(dd, dir), perp = abs(dd.x * dir.y - dd.y * dir.x), len = length(tp - o);
    float wid = .025 + along * .11, reach = smoothstep(len + .22, len - .08, along) * smoothstep(0., .5, along);
    float beam = (smoothstep(wid, wid * .3, perp) * (.5 + .5 * f) + exp(-pow(perp / (wid * 2.4), 2.)) * .35) * reach;
    vec2 e = (s - tp + vec2(0., .1)) * vec2(1.9, 5.2);
    vec3 lc = mix(uTint, vec3(1.), .32);
    col += lc * (beam * .3 + exp(-dot(e, e)) * .5 + wave * .25);
    vec2 g = s - vec2(.05 * uAsp, -.1);
    col += uC1 * exp(-dot(g, g) * 3.) * .22;
    col *= .55 + .45 * smoothstep(1.25, .2, vig);
  } else if (m == 2) { // مدار: سديم هادي، وأرضية ضوء تحت الحلقة
    col = uBase + (col - uBase) * pow(f, 1.3) * 1.1;
    vec2 e = (s - vec2(.426 * uAsp, .39)) * vec2(1.1, 4.6);
    col += mix(uTint, uC2, .35) * exp(-dot(e, e)) * .32;
    col += uTint * (exp(-dt * dt * 4.) * .16 + wave * .3);
    col *= .5 + .5 * smoothstep(1.3, .25, vig);
  } else if (m == 3) { // منتصف الليل: أسود، وشريط شفق رفيع يتموّج فوق
    float n = fbm(vec2(uv.x * 1.8 + t * 2., t * 1.5));
    float d = uv.y - (.79 + (n - .5) * .16 + .02 * sin(uv.x * 5. + uTime * .08)); // فوق خط الشفق موجب
    float amp = smoothstep(.26, .58, n); // الشفق يتقطع ويرجع
    float curtain = smoothstep(-.012, .004, d) * exp(-max(d, 0.) / .085) * (.7 + .3 * noise(vec2(uv.x * 70. + n * 6., t * 4.)));
    vec3 ac = mix(mix(uC2, vec3(1.), .12), uC3, smoothstep(0., .14, d)); // تحت لون، وفوق لون ثاني مثل الشفق الحقيقي
    col = uBase * .2 + ac * curtain * amp * .75;
    col += mix(uC2, vec3(1.), .4) * exp(-d * d / .00012) * amp * .25;
    col += mix(uC2, uTint, .6) * exp(-pow(uv.y * 3., 2.)) * .09;
    col += uTint * (exp(-dt * dt * 6.) * .08 + wave * .18);
  } else { // خزف: نهاري، ألوان الحرير تصير باستيل فاتح
    col = vec3(.955, .962, .978);
    col = mix(col, mix(uC1, vec3(1.), .5), smoothstep(.3, .85, f) * .62);
    col = mix(col, mix(uC2, vec3(1.), .6), smoothstep(.4, .95, length(q)) * .4);
    col = mix(col, mix(uC3, vec3(1.), .55), smoothstep(.55, .92, r.y) * .35);
    col += pow(folds, 9.) * .08 * smoothstep(.3, .75, f); // لمعة الساتان
    col = mix(col, mix(uTint, vec3(1.), .5), exp(-dt * dt * 3.) * .3 + wave * .2);
    col *= .9 + .1 * smoothstep(1.3, .3, vig);
  }

  // الدخولية: خط ضوء ثم الخلفية تنفتح
  float e = length(vec2((uv.x - .5) * uAsp * .5, (uv.y - .5) * 1.7));
  float R = uReveal * 1.35;
  vec3 light = m == 4 ? uC1 * .85 : mix(uC1, vec3(1.), .7);
  vec3 outc = mix(m == 4 ? vec3(.94, .95, .97) : vec3(0.), col, smoothstep(R, R - .3, e));
  float dy = (uv.y - .5) * 540.;
  float w = uStreak * .55;
  float streak = exp(-dy * dy / 3.) * smoothstep(w, w - .25, abs(uv.x - .5));
  float halo = exp(-dy * dy / 500.) * smoothstep(w, 0., abs(uv.x - .5)) * .35;
  float glow = exp(-pow((e - R) * 9., 2.)) * .55 * (1. - uReveal) * step(.001, uReveal) + (streak + halo) * uStreak * (1. - uReveal);
  outc = m == 4 ? mix(outc, light, clamp(glow, 0., 1.)) : outc + light * glow;
  gl_FragColor = vec4(outc, 1.);
}
</script>

<!-- الطبقة 2: زجاج سائل حقيقي: انكسار، ضبابية، حافة لامعة، والقطع تندمج مع بعض -->
<script id="fsGlass" type="x-shader">
precision highp float;
varying vec2 vUv;
uniform sampler2D uBg;
uniform vec2 uRes;
uniform float uScale, uK, uGlass, uPa, uGM, uPillMode;
uniform vec4 uR0, uR1, uR2, uP;
uniform vec3 uRr, uPillCol;

float sdRR(vec2 p, vec4 r, float rad) {
  rad = min(rad, min(r.z, r.w));
  vec2 d = abs(p - r.xy) - r.zw + rad;
  return length(max(d, 0.)) + min(max(d.x, d.y), 0.) - rad;
}
float smin(float a, float b, float k) { float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
float scene(vec2 p) {
  float d = sdRR(p, uR0, uRr.x);
  d = smin(d, sdRR(p, uR1, uRr.y), uK);
  return smin(d, sdRR(p, uR2, uRr.z), uK);
}
vec3 bg(vec2 uv) { return texture2D(uBg, uv).rgb; }

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uScale; // بكسلات الشاشة 1920×1080
  vec3 col = bg(vUv);
  float d = scene(p);
  if (uGM > 1.5) { // خزف: ظل أزرق ناعم نازل تحت الزجاج
    float ds = scene(p - vec2(0., 24.));
    col = mix(col, col * vec3(.72, .78, .9), (1. - smoothstep(-10., 90., ds)) * step(0., d) * .5 * uGlass);
  } else col *= 1. - (1. - smoothstep(0., 80., d)) * step(0., d) * .34 * uGlass; // ظل تحت الزجاج
  if (d < 2. && uGlass > 0.) {
    vec2 g = vec2(scene(p + vec2(1., 0.)) - scene(p - vec2(1., 0.)), scene(p + vec2(0., 1.)) - scene(p - vec2(0., 1.)));
    vec2 n = g / max(length(g), 1e-4);
    float edge = clamp(1. + d / 32., 0., 1.);
    float bend = edge * edge * edge;
    vec2 px = vec2(1. / 1920., 1. / 1080.);
    vec2 base = vUv + vec2(-n.x, n.y) * bend * 42. * px;
    float ca = bend * 6.;
    vec3 acc = vec3(bg(base + vec2(ca, 0.) * px).r, bg(base).g, bg(base - vec2(ca, 0.) * px).b);
    for (int i = 0; i < 8; i++) {
      float a = float(i) * .7853982 + .39;
      vec2 k = vec2(cos(a), sin(a));
      acc += bg(base + k * 26. * px) + bg(base + k * 11. * px);
    }
    vec3 glass = acc / 17.;
    glass = mix(vec3(dot(glass, vec3(.299, .587, .114))), glass, 1.18) * 1.07 + .045;
    vec2 L = normalize(vec2(-.55, -1.));
    float rim = smoothstep(.45, 1., edge);
    float hi = pow(max(dot(n, L), 0.), 1.4) * rim, lo = pow(max(dot(n, -L), 0.), 2.) * rim;
    float line = smoothstep(1.4, 0., abs(d + 1.));
    float dp = sdRR(p, uP, uP.w);
    float pe = clamp(1. + dp / 12., 0., 1.);
    float pill = smoothstep(1., -1., dp) * uPa * (.1 + pow(pe, 4.) * .32) * (1. - uPillMode);
    if (uGM < .5) glass += hi * .55 + lo * .2 + line * .25 + pill;
    else if (uGM < 1.5) { glass = glass * .36 + .01 + hi * .7 + lo * .16 + line * .42 + pill * 1.2; } // سبج: زجاج داكن بحافة ضوء رفيعة
    else { glass = mix(glass, vec3(1.), .66) + hi * .25 - line * .07; glass = mix(glass, uPillCol, pill * 1.1); } // خزف: أبيض مصنفر
    col = mix(col, glass, smoothstep(1., -1., d) * uGlass);
  }
  if (uPillMode > .5) { // سينما: خط ضوء تحت التبويب المختار بدل الشريحة
    float db = sdRR(p, vec4(uP.x, uP.y + uP.w - 5., max(uP.z - 20., 0.), 2.), 2.);
    col += uPillCol * (smoothstep(1., -1., db) + exp(-max(db, 0.) / 9.) * .4) * min(uPa, 1.2) * .9;
  }
  gl_FragColor = vec4(col, 1.);
}
</script>

const PRAYERS = [['الفجر', 264], ['الظهر', 684], ['العصر', 880], ['المغرب', 1025], ['العشاء', 1115]];
const minutesAr = m => m === 1 ? 'دقيقة' : m === 2 ? 'دقيقتين' : m <= 10 ? m + ' دقايق' : m + ' دقيقة';
function remainAr(min) {
  if (min <= 0) return 'الآن';
  if (min < 60) return 'بعد ' + minutesAr(min);
  const h = Math.floor(min / 60), m = min % 60;
  const hs = h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : h <= 10 ? h + ' ساعات' : h + ' ساعة';
  return 'بعد ' + hs + (m ? ' و' + minutesAr(m) : '');
}
function nextPrayer() {
  const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
  let [name, at] = PRAYERS.find(([, t]) => t > now) || [PRAYERS[0][0], PRAYERS[0][1] + 1440];
  const h = Math.floor(at / 60) % 24, m = String(at % 60).padStart(2, '0');
  const clock = S.clock24 ? String(h).padStart(2, '0') + ':' + m : ((h % 12) || 12) + ':' + m + (h < 12 ? ' ص' : ' م');

class Sp { // نابض: يعطي الحركة إحساس السائل (يتجاوز الهدف شوي ويرجع)
  constructor(v) { this.v = v; this.t = v; this.vel = 0; }

      ${cfg.body ? `<div class="sheet-body">${cfg.body}</div>` : ''}
      ${cfg.input ? `<input class="sheet-input" id="sheetInput" maxlength="20" autocomplete="off"><p class="sheet-hint">OK للحفظ، ورجوع للإلغاء</p>` : ''}
      ${cfg.items ? `<div class="opts"><div class="opts-in"><span class="hl"></span>${cfg.items.map(opt).join('')}</div></div>` : ''}
    </div>`;
  sheetEl.classList.add('show');
  $('#scrim').classList.add('show');
  stage.classList.add('sheet-open');
  if (swap) sheetEl.firstElementChild.animate([{ opacity: 0, transform: 'translateX(36px)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'none' }],
                                              { duration: 380, easing: 'cubic-bezier(.22,.8,.24,1)' });
  if (cfg.input) { const inp = $('#sheetInput'); inp.value = cfg.input.value; setTimeout(() => { inp.focus(); inp.select(); }, 80); }
  sheetFocus();
}
function sheetFocus() {
  if (!SH.cfg.items) return;
  const opts = sheetEl.querySelectorAll('.opt'), el = opts[SH.idx], hl = $('.hl', sheetEl);
  opts.forEach((o, i) => o.classList.toggle('is-focused', i === SH.idx));
  hl.style.transform = `translateY(${el.offsetTop}px)`;
  SH.cfg.preview?.(SH.idx);
  const box = $('.opts', sheetEl), inner = $('.opts-in', sheetEl);
  const max = Math.max(0, inner.scrollHeight - box.clientHeight);
  const y = Math.min(max, Math.max(0, el.offsetTop + 32 - box.clientHeight / 2));
  inner.style.transform = `translateY(${-y}px)`;
  box.classList.toggle('more-t', y > 1);
  box.classList.toggle('more-b', y < max - 1);
}
function closeSheet() {
  SH = null;
  sheetEl.classList.remove('show');
  $('#scrim').classList.remove('show');
  stage.classList.remove('sheet-open');
  document.activeElement?.blur();
}
function pick(i) {
  pendingClose = true;
  SH.cfg.items[i].act();
  if (pendingClose) closeSheet(); // إلا لو الخيار فتح قائمة ثانية
}
function sheetKey(e) {
  const k = e.key;
  if (SH.cfg.input) {
    if (k === 'Enter') { const v = $('#sheetInput').value, save = SH.cfg.input.save; closeSheet(); save(v); }
    else if (k === 'Escape') closeSheet();
    else return;
    return e.preventDefault();
  }
  e.preventDefault();
  if (k === 'ArrowDown' || k === 'ArrowUp') {
    const ni = SH.idx + (k === 'ArrowDown' ? 1 : -1);
    if (ni >= 0 && ni < SH.cfg.items.length) { SH.idx = ni; sheetFocus(); }
  } else if (k === 'Enter' && !e.repeat) pick(SH.idx);
  else if (k === 'Escape' || k === 'Backspace') cancelSheet();
}
function cancelSheet() { const c = SH?.cfg.cancel; closeSheet(); c?.(); }
const message = (title, body) => openSheet({ title, body, items: [{ label: 'تمام', act: noop }] });

// ---------- الإعدادات ----------
const introName = id => INTROS.find(x => x.id === id).name;
function showSettings(at = 0) {
  openSheet({ title: 'إعدادات واجهتي', focus: at, items: [
    { icon: 'layout', label: 'الثيم', value: STY().name, act: chooseStyle },
    { icon: 'image', label: 'الخلفية', value: PAL[S.theme] ? PAL[S.theme].name : 'صورتي', act: chooseTheme },
    { icon: 'user', label: 'الاسم في الترحيب', value: S.name || 'بدون', act: editName },
    { icon: 'sparkles', label: 'الدخولية', value: introName(S.intro), act: chooseIntro },
    { icon: 'playCircle', label: 'شغّل الدخولية الآن', act: playIntro },
    { icon: 'clock', label: 'الساعة', value: S.clock24 ? '24 ساعة' : '12 ساعة', act: () => { S.clock24 = !S.clock24; remember(); tick(); showSettings(5); } },
    { sep: true, icon: 'plug', label: 'قسم المصادر (HDMI)', value: S.showInputs ? 'ظاهر' : 'مخفي',
      act: () => { S.showInputs = !S.showInputs; refresh(); showSettings(6); } },
    { icon: 'eye', label: 'التطبيقات المخفية', value: hidden.size ? String(hidden.size) : 'ولا واحد', act: showHidden },
    { icon: 'rotate', label: 'رجّع الترتيب الافتراضي', act: confirmReset },
    { sep: true, icon: 'home', label: 'افتح الواجهة الأصلية', act: () => note('تنفتح الواجهة الأصلية، وترجع واجهتي بعد 3 دقايق') },
    { icon: 'gear', label: 'إعدادات التلفزيون', act: () => note('تنفتح إعدادات التلفزيون') },
    { icon: 'help', label: 'طريقة الاستخدام', act: help },
  ] });
}
function setTheme(id) {
  S.theme = id;
  remember();
  const light = STY().light, accent = light ? PAL[id].c1 : PAL[id].accent;
  stage.style.setProperty('--accent', accent);
  if (G) { G.theme(id); G.st.pc = hex(light ? '#1E2C46' : accent); }
}
/** تبديل الثيم: العالم يتضبّب لحظة، والزجاج يسيل لأماكنه الجديدة. */
function setStyle(id, now) {
  const swap = () => {
    const s = STYLES[id];
    S.style = id;
    stage.classList.remove(...Object.keys(STYLES).map(k => 'st-' + k));
    stage.classList.add('st-' + id);
    setTheme(S.theme);
    if (G) Object.assign(G.st, { mode: s.mode, gm: s.gm, pm: s.pill, glassT: s.glass });
    if (!rows.length) return;
    renderShelf();
    syncGlass();
    syncPill(true);
  };
  if (now || reduce) return swap();
  const base = getComputedStyle(world).filter; // يكمل من تعتيم القائمة لو مفتوحة
  world.animate([{ filter: (base === 'none' ? '' : base + ' ') + 'blur(22px) brightness(.6)', offset: .35 }], { duration: 950, easing: 'cubic-bezier(.45,0,.25,1)' });
  setTimeout(swap, 330);
}
function chipBg(id) { // معاينة صغيرة لكل ثيم بألوان الخلفية الحالية
  const p = PAL[S.theme] || PAL.night;
  return {
    liquid: `radial-gradient(70% 90% at 75% 20%, ${p.c1}, transparent 70%), radial-gradient(70% 90% at 15% 90%, ${p.c2}, transparent 70%), ${p.base}`,
    cinema: `radial-gradient(26% 120% at 58% -14%, rgba(255,244,228,.9), transparent 75%), radial-gradient(40% 26% at 58% 80%, rgba(255,244,228,.5), transparent), #050506`,
    orbit: `radial-gradient(46% 20% at 50% 76%, ${p.c1}, transparent), radial-gradient(90% 80% at 50% 40%, ${p.c3}66, transparent 70%), ${p.base}`,
    midnight: `radial-gradient(90% 8% at 50% 30%, ${p.c2}, transparent), radial-gradient(80% 24% at 50% 22%, ${p.c1}99, transparent), #000`,
    porcelain: `radial-gradient(70% 90% at 75% 20%, ${p.c1}55, transparent 70%), linear-gradient(160deg, #fff, #E3EAF4)`,
  }[id];
}
let previewT;
function chooseStyle() { // تتنقل بينها فتشوف كل ثيم ورا القائمة، ورجوع يرجّع اللي كان
  const ids = Object.keys(STYLES), was = S.style;
  const show = id => { clearTimeout(previewT); if (S.style !== id) setStyle(id); };
  openSheet({ title: 'الثيم', sub: 'تنقّل بينها وشوف كل واحد مباشرة.', focus: ids.indexOf(S.style),
    preview: i => { clearTimeout(previewT); previewT = setTimeout(() => show(ids[i]), 260); },
    cancel: () => show(was),
    items: ids.map(id => ({ chip: id, label: STYLES[id].name, value: STYLES[id].desc, check: was === id, act: () => show(id) })) });
}
function chooseTheme() {
  const ids = Object.keys(PAL);
  openSheet({ title: 'الخلفية', sub: 'تتغير مباشرة، وألوان الواجهة والدخولية تمشي معها.', focus: Math.max(0, ids.indexOf(S.theme)),
    items: [...ids.map(id => ({ swatch: id, label: PAL[id].name, check: S.theme === id, act: () => setTheme(id) })),
            { icon: 'image', label: 'صورتي (ترسلها من الكمبيوتر)', act: () => message('صورة من عندك',
              '<p>افتح أداة واجهتي على الكمبيوتر واضغط «اختيار صورة خلفية»، والصورة توصل للتلفزيون وتتركّب لحالها.</p><p>المقاس الأفضل 1920×1080 أو 3840×2160.</p>') }] });
}
function editName() {
  openSheet({ title: 'اسمك', sub: 'يطلع في الترحيب والدخولية. خلّه فاضي لو ما تبي اسم.',
    input: { value: S.name, save: v => { S.name = v.trim(); remember(); tick(); note(S.name ? `تمام يا ${S.name}` : 'انشال الاسم'); } } });
}
function chooseIntro() {
  openSheet({ title: 'الدخولية', sub: '«كل ما تشغّل التلفزيون» يعني تطلع أول ما تفتح الشاشة بالريموت.',
    focus: INTROS.findIndex(x => x.id === S.intro),
    items: INTROS.map(x => ({ label: x.name, check: S.intro === x.id, act: () => { S.intro = x.id; } })) });
}
function showHidden() {
  const list = [...hidden];
  if (!list.length) return message('التطبيقات المخفية', '<p>ما فيه تطبيقات مخفية.</p>');
  openSheet({ title: 'التطبيقات المخفية', sub: 'اختر تطبيق عشان يرجع يظهر.',
    items: list.map(k => ({ icon: 'eye', label: APPS[k].label, act: () => { hidden.delete(k); refresh(); note('رجع ' + APPS[k].label); } })) });
}
function confirmReset() {
  openSheet({ title: 'رجّع الترتيب الافتراضي؟', sub: 'يرجّع الأقسام والمفضلة والتطبيقات المخفية مثل أول مرة. الخلفية والاسم يبقون.', focus: 1,
    items: [{ label: 'نعم، رجّعه', act: () => { L = clone(DEFAULT); hidden.clear(); S.showInputs = true; refresh(); note('رجع الترتيب الافتراضي'); } },
            { label: 'لا', act: noop }] });
}
function help() {
  message('طريقة الاستخدام', `<ul>
    <li>اضغط مطوّل على OK فوق أي تطبيق عشان تحرّكه، أو تنقله لقسم ثاني، أو تضيفه للمفضلة، أو تخفيه.</li>
    <li>فوق وتحت تنقلك بين الأقسام، والتبويبات فوق توريك وين أنت.</li>
    <li>زر الرئيسية يرجّعك لأول تطبيق.</li>
    <li>الاسم والخلفية وصورتك تقدر ترسلها من أداة واجهتي على الكمبيوتر.</li></ul>`);
}

// =====================================================================
//  الدخولية: خط ضوء ← الخلفية تنفتح ← الزجاج يتكوّن ← «يا هلا» ← الزجاج يتقسم لقطع الواجهة
// =====================================================================
const INTRO = { on: false, t0: 0, phase: 0, card: 1.5, exit: 4.7, fast: -1 };
let hinted = false;
function playIntro() {
  if (moving) endMove();
  if (SH) closeSheet();
  const [hm, ap] = clockParts(), p = parts(new Date());
  const el = $('#intro');
  el.className = 'intro';
  el.innerHTML = `<div class="intro-text">
      <h1 class="intro-hello">${S.name ? 'يا هلا ' + S.name : 'يا هلا وغلا'}</h1>
      <p class="intro-sub">${greeting()}، ${p.weekday} ${p.day} ${p.month}</p>
      <p class="intro-time">${hm}${ap ? ' ' + ap : ''}</p></div>`;
  stage.classList.remove('entering');
  stage.classList.add('intro-on');
  Object.assign(INTRO, { on: true, t0: performance.now() / 1000, phase: 0, card: 1.5, exit: 4.7, fast: -1 });
  if (G) { G.st.reveal = 0; G.st.streak = 0; G.st.glass = G.st.glassT = 0; G.st.pa.snap(0); }
  if (!G) INTRO.card = INTRO.exit = .2;
}
function skipIntro() {
  const e = performance.now() / 1000 - INTRO.t0;
  if (INTRO.phase >= 2) return;
  INTRO.fast = e;
  if (e < INTRO.card) INTRO.card = e;
  INTRO.exit = Math.max(INTRO.card + .3, e + .05);
}
function introTick(t) {
  if (!INTRO.on) return;
  const e = t - INTRO.t0, st = G && G.st;
  if (st) {
    let s = ease((e - .2) / .9), r = ease((e - 1) / 1.3);
    if (INTRO.fast >= 0) { const f = ease((e - INTRO.fast) / .5); s = Math.max(s, f); r = Math.max(r, f); }
    st.streak = s; st.reveal = r;
  }
  if (INTRO.phase === 0 && e >= INTRO.card) {
    INTRO.phase = 1;
    if (st) { // قطرة زجاج تنفتح من خط الضوء وتتمايل مثل السائل
      st.glass = st.glassT = 1;
      st.blobs.forEach(b => { b.k = 85; b.c = 10; b.to([960, 540, 10, 1, 1], true); b.to([960, 540, 600, 230, 72]); });
    }
  }
  if (INTRO.phase === 1 && e >= INTRO.exit) {
    INTRO.phase = 2;
    $('#intro').classList.add('out');
    stage.classList.remove('intro-on');
    stage.classList.add('entering');
    if (st) { // الزجاج يتقسم لقطع الواجهة الثلاث، كل وحدة تلحق الثانية (وفي السينما يذوب)
      const targets = glassTargets();
      st.glassT = STY().glass;
      st.blobs.forEach((b, i) => setTimeout(() => { b.k = 110; b.c = 14; b.to(targets[i]); }, i * 90));
      syncPill(true);
      setTimeout(() => { st.pa.t = zone === 'tabs' ? 1.9 : 1; }, 700);
    }
    enterTiles(track(), 'down', 450);
  }
  if (INTRO.phase === 2 && e >= INTRO.exit + 1.8) {
    INTRO.phase = 3;
    INTRO.on = false;
    stage.classList.remove('entering');
    $('#intro').innerHTML = '';
    if (st) st.blobs.forEach(b => { b.k = 140; b.c = 19; });
    if (!hinted) { hinted = true; note('تنقّل بالأسهم، واضغط OK للتشغيل، ومطوّل للخيارات'); }
  }
}

// ---------- الريموت (الكيبورد) ----------
let lp = null, longFired = false;
addEventListener('keydown', e => {
  if (INTRO.on) { e.preventDefault(); return skipIntro(); }
  if (SH) return sheetKey(e);
  if (moving) { e.preventDefault(); return moveKey(e.key); }
  switch (e.key) {
    case 'ArrowLeft': moveH(1); break;
    case 'ArrowRight': moveH(-1); break;
    case 'ArrowUp': moveV(-1); break;
    case 'ArrowDown': moveV(1); break;
    case 'Enter':
      if (zone === 'tabs') { setZone('shelf'); break; }
      if (!e.repeat) { longFired = false; clearTimeout(lp); lp = setTimeout(() => { longFired = true; itemMenu(); }, 550); }
      break;
    case 'Home': setZone('shelf'); switchCat(0, 'up'); cur = 0; focusTile(); break;
    case 'ContextMenu': itemMenu(); break;
    default:
      if (e.code === 'KeyM') itemMenu();
      else if (e.code === 'KeyS') showSettings();
      else if (e.code === 'KeyT') { const ids = Object.keys(STYLES); setStyle(ids[(ids.indexOf(S.style) + 1) % ids.length]); }
      else return;
  }
  e.preventDefault();
});
addEventListener('keyup', e => {
  if (e.key !== 'Enter' || lp === null) return;
  clearTimeout(lp);
  lp = null;
  if (!longFired && !SH && !moving && !INTRO.on) openApp(focusedKey());
});

// الماوس للمعاينة على الكمبيوتر
$('#shelfRow').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (!t || t.parentElement.classList.contains('leaving')) return;
  if (moving) return endMove();
  setZone('shelf');
  const i = [...t.parentElement.children].indexOf(t), dir = Math.sign(i - cur);
  cur = i;
  focusTile(dir);
  openApp(focusedKey());
});
$('#shelfRow').addEventListener('contextmenu', e => {
  const t = e.target.closest('.tile');
  if (!t) return;
  e.preventDefault();
  cur = [...t.parentElement.children].indexOf(t);
  focusTile();
  itemMenu();
});
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) { const n = +t.dataset.i; switchCat(n, n > ci ? 'next' : 'prev'); }
});
sheetEl.addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (!o || !SH) return;
  SH.idx = +o.dataset.i;
  sheetFocus();
  pick(SH.idx);
});
$('#scrim').addEventListener('click', cancelSheet);

function fit() {
  scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  if (G) G.size(Math.min(1, scale * (devicePixelRatio || 1)));
}
addEventListener('resize', fit);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  introTick(now / 1000);
  if (G) G.draw(now / 1000, dt);
  requestAnimationFrame(frame);
}

fit();
setStyle(S.style, true);
tick();
setInterval(tick, 15000);
rows = buildRows();
renderTabs();
renderShelf();
setHints();
if (window !== top) hinted = true; // داخل الأداة: بدون تلميح الأزرار
document.fonts.ready.then(() => { syncGlass(true); playIntro(); if (Q.get('intro') === '0') skipIntro(); requestAnimationFrame(frame); });
</script>
</body>
</html>
